server {

  listen 80;

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  # index.html references the hashed bundles; a cached copy keeps serving the
  # previous bundle after a deploy (seen on UAT expo-web, 12 Aug 2026).
  location = /index.html {
    root   /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  error_page   500 502 503 504  /50x.html;

  location = /50x.html {
    root   /usr/share/nginx/html;
  }

}