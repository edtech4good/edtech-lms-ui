name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # TODO(docs/ci-cd-plan.md #0.2): plain `npm ci` fails on an
      # @angular-eslint/schematics vs @angular/cli peer conflict. Drop
      # --legacy-peer-deps once that conflict is resolved.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Build the shipped configuration. src/environments/environment.prod.ts
      # IS committed, with placeholder values (workspace#63 confirmed the
      # prod build passes: 3.11 MB initial bundle, a budget warning, not an
      # error). The droplet's hand-edited environment.prod.ts is a runtime
      # deploy-time edit to that same tracked file, not a build input this
      # check depends on.
      - name: Build
        run: npm run build -- --configuration production

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Report only: never fails the job or the workflow. Advisory counts
      # are too high across the org today (docs/ci-cd-plan.md) to gate a PR.
      - name: npm audit (critical only, non-blocking)
        run: |
          npm audit --audit-level=critical > audit.txt 2>&1 || true
          cat audit.txt
          { echo "### npm audit (report only)"; echo '```'; tail -n 80 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
