version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # Dependabot skips deprecated packages. @angular/animations is marked
      # deprecated on npm, so it is left behind and its exact-version peer pin on
      # @angular/core breaks npm ci: bump it by hand with each Angular patch. It
      # cannot be removed yet because @swimlane/ngx-charts imports trigger()/
      # transition() from it at runtime (the dashboard charts) and peers on it.
      # @angular/platform-browser-dynamic is no longer a direct dependency, but
      # ngx-charts peers on it too, so npm still installs it as a peer: check it
      # moves with the rest of the group on each Angular patch.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
        update-types:
          - minor
          - patch
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Angular and toolchain versions are intentionally pinned; major bumps are
    # deliberate tasks managed as explicit PRs. Karma is deprecated; not worth bumps.
    ignore:
      - dependency-name: "@angular/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@angular-devkit/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@ngrx/*"
        update-types:
          - version-update:semver-major
      # ng-zorro-antd's majors require the matching Angular major; bump it with the Angular upgrade.
      - dependency-name: "ng-zorro-antd"
        update-types:
          - version-update:semver-major
      - dependency-name: "zone.js"
        update-types:
          - version-update:semver-major
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      - dependency-name: "rxjs"
        update-types:
          - version-update:semver-major
      - dependency-name: "karma*"
      # jasmine-core 7 is real but karma-jasmine (^5.1.0, the newest release)
      # still hard-depends on jasmine-core ^4.1.0 and resolves its own nested
      # copy at runtime, so bumping the top-level version here has no effect
      # on the test framework Karma actually loads. Revisit if karma-jasmine
      # ever relaxes that pin. See #79.
      - dependency-name: "jasmine-core"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/jasmine"
        update-types:
          - version-update:semver-major
      # eslint 9+ needs flat config and a matching @typescript-eslint (we're on
      # 5.x); moving the lint toolchain is its own task, not a bump. See #80.
      - dependency-name: "eslint"
        update-types:
          - version-update:semver-major
      - dependency-name: "@typescript-eslint/*"
        update-types:
          - version-update:semver-major
