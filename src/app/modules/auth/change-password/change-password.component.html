@if (changePasswordisVisible) {
  <app-auth-layout heading="Change password" subheading="Choose a new password for your account.">
    <form class="auth-form" [formGroup]="changePassworForm" (ngSubmit)="submitLoginForm()">
      <div class="field">
        <label class="field-label" for="new-password">New password</label>
        <input
          id="new-password"
          class="field-input"
          [class.invalid]="showInvalid('lmsuserpassword')"
          type="password"
          formControlName="lmsuserpassword"
          autocomplete="new-password"
          [attr.aria-invalid]="showInvalid('lmsuserpassword') ? 'true' : null"
          [attr.aria-describedby]="showInvalid('lmsuserpassword') ? 'new-password-error' : null"
        />
        @if (showInvalid('lmsuserpassword')) {
          <p class="field-error" id="new-password-error" role="alert">Enter a new password.</p>
        }
      </div>
      <div class="field">
        <label class="field-label" for="confirm-password">Confirm password</label>
        <input
          id="confirm-password"
          class="field-input"
          [class.invalid]="showInvalid('lmsuserconfirmpassword')"
          type="password"
          formControlName="lmsuserconfirmpassword"
          autocomplete="new-password"
          [attr.aria-invalid]="showInvalid('lmsuserconfirmpassword') ? 'true' : null"
          [attr.aria-describedby]="showInvalid('lmsuserconfirmpassword') ? 'confirm-password-error' : null"
        />
        @if (showInvalid('lmsuserconfirmpassword')) {
          <p class="field-error" id="confirm-password-error" role="alert">Enter the new password again.</p>
        }
      </div>

      <button type="submit" class="submit">Change password</button>
      <button type="button" class="secondary" routerLink="/auth/login">Back to sign in</button>
    </form>
  </app-auth-layout>
}
