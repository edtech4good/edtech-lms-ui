<button nz-button nzSize="small" nzType="link" (click)="showuploadDocument()">
  Upload
</button>
<nz-modal
  [nzWidth]="'calc(73vw)'"
  [nzBodyStyle]="{ minheight: '300px' }"
  [(nzVisible)]="showUpload"
  nzTitle="Upload Document"
  nzOkText="Submit"
  nzCancelText="Cancel"
  (nzOnOk)="handleUpload()"
  (nzOnCancel)="hideuploadDocument()"
  [nzOkLoading]="uploading"
>
  <ng-container *nzModalContent>
    <nz-spin [nzSpinning]="uploading">
      <nz-alert
        *ngIf="refusal"
        class="upload-refusal"
        nzType="error"
        [nzMessage]="refusal"
        nzShowIcon
        style="margin-bottom: 12px"
      ></nz-alert>
      <nz-upload
        [(nzFileList)]="fileList"
        [nzBeforeUpload]="beforeUpload"
        nzType="drag"
        [nzMultiple]="false"
      >
        <p class="ant-upload-drag-icon">
          <i nz-icon nzType="inbox"></i>
        </p>
        <p class="ant-upload-text">Click or drag file to this area to upload</p>
        <p class="ant-upload-hint">
          Any file name works. The title is optional. Strictly prohibit from
          uploading company data or other band files
        </p>
      </nz-upload>
      <app-document-metadata-fields
        style="display: block; margin-top: 16px"
        [model]="meta"
        [compact]="true"
        idPrefix="uploader"
      ></app-document-metadata-fields>
    </nz-spin>
  </ng-container>
</nz-modal>
