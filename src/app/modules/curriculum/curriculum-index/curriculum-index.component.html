<div nz-row>
  <div nz-col nzSpan="24">
    <nz-card [nzBordered]="true" nzTitle="Curriculum" [nzExtra]="extraTemplate">
      <app-owner-filter [value]="organisationFilter" (changed)="onOwnerFilter($event)"></app-owner-filter>
      <nz-table
        nzShowSizeChanger
        [nzLoading]="dataloading"
        [nzData]="data"
        nzSize="small"
        [nzFrontPagination]="false"
        [nzTotal]="total"
        [nzPageSize]="pageSize"
        [nzPageIndex]="pageIndex"
        [nzHideOnSinglePage]="true"
        [nzBordered]="true"
        [nzHideOnSinglePage]="false"
        [nzPageSizeOptions]="[10, 20, 50, 100, 200]"
        [nzScroll]="{ y: '640px' }"
        (nzQueryParams)="onQueryParamsChange($event)"
        [nzShowTotal]="totalTemplate"
      >
        <thead>
          <tr>
            <th nzColumnKey="curriculumname" nzCustomFilter>
              Curriculum Name
              <nz-filter-trigger
                [(nzVisible)]="visible"
                [nzActive]="searchValue.length > 0"
                [nzDropdownMenu]="menu"
              >
                <i nz-icon nzType="search"></i>
              </nz-filter-trigger>
            </th>
            <th *ngIf="owner.active()" nzColumnKey="">Organisation</th>
            <th nzColumnKey="">Country</th>
            <th nzColumnKey="">Subject</th>
            <th nzColumnKey="">State</th>
            <th nzColumnKey="">Tools</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of data">
            <td>{{ data.curriculumname }}</td>
            <td *ngIf="owner.active()"><app-owner-name [id]="data.organisationid"></app-owner-name></td>
            <td>
              <div nzSize="small" *ngFor="let country of data.countryid">
                {{ country }}
              </div>
            </td>
            <td>{{ data.subjectid }}</td>
            <td [attr.data-testid]="'state-' + data.curriculumid">
              @let state = stateOf(data.curriculumid);
              @switch (state.kind) {
                @case ('ready') {
                  <app-publication-pill [pill]="state.pill"></app-publication-pill>
                }
                @case ('failed') {
                  <span class="state-unknown" title="The state could not be read" data-testid="state-unknown">—</span>
                }
                @default {
                  <span class="state-unknown" role="status" aria-label="Reading the state" data-testid="state-loading">…</span>
                }
              }
            </td>
            <td>
              <button
                nz-button
                nzType="primary"
                nzSize="small"
                type="button"
                style="margin-right: 12px"
                data-testid="publish-row"
                [attr.aria-label]="'Publish ' + data.curriculumname"
                [disabled]="isBusy(data.curriculumid)"
                (click)="openPublish(data)"
                *ngxPermissionsOnly="['publish_curriculum']"
              >
                Publish
              </button>

              <button
                nz-button
                nzSize="small"
                type="button"
                style="margin-right: 12px"
                data-testid="retire-row"
                [attr.aria-label]="'Retire ' + data.curriculumname"
                [attr.title]="retireDisabled(data.curriculumid) && !isBusy(data.curriculumid) ? 'Not published, so there is nothing to retire' : null"
                [disabled]="retireDisabled(data.curriculumid)"
                (click)="confirmRetire(data)"
                *ngxPermissionsOnly="['publish_curriculum']"
              >
                Retire
              </button>

              <a
                nz-button
                nzDanger
                nzSize="small"
                style="margin-right: 20px"
                data-testid="delete-row"
                nz-popconfirm
                nzPopconfirmTitle="Sure to delete?"
                (nzOnConfirm)="deletetag(data.curriculumid)"
                *ngxPermissionsOnly="['delete_curriculum']"
                >Delete</a
              >

              <a
                nz-button
                [routerLink]="['/curriculum', 'update', data.curriculumid]"
                nzType="primary"
                nzSize="small"
                *ngxPermissionsOnly="['update_curriculum']"
                >Edit</a
              >
            </td>
          </tr>
        </tbody>
      </nz-table>
    </nz-card>
    <ng-template #extraTemplate>
      <app-create-action link="/curriculum/create" *ngxPermissionsOnly="['create_curriculum']"></app-create-action>
      <!-- Whoever holds sync_content (an Admin or Organisation Admin, for their own organisation) or the platform account
           (superadmin) re-pushes the published set; the tooltip is on a wrapper because the popconfirm already owns the
           button's overlay. -->
      <span
        *ngxPermissionsOnly="['superadmin', 'sync_content']"
        nz-tooltip
        nzTooltipTitle="Re-push the published set to the learner server"
        data-testid="sync-content-wrap"
      >
        <a
          nz-button
          nzType="primary"
          style="margin-right: 20px"
          data-testid="sync-content"
          nz-popconfirm
          nzPopconfirmTitle="Sure to sync?"
          (nzOnConfirm)="cloudsync()"
          >Sync Content</a
        >
      </span>
    </ng-template>
    <nz-dropdown-menu #menu="nzDropdownMenu">
      <div class="ant-table-filter-dropdown">
        <div class="search-box">
          <input
            type="text"
            nz-input
            placeholder="Search curriculum"
            [(ngModel)]="searchValue"
          />
          <button
            nz-button
            nzSize="small"
            nzType="primary"
            (click)="search()"
            class="search-button"
          >
            Search
          </button>
          <button nz-button nzSize="small" (click)="reset()">Reset</button>
        </div>
      </div>
    </nz-dropdown-menu>
  </div>
</div>
<app-publish-drawer (published)="onPublished($event)" (missing)="onMissing()"></app-publish-drawer>
<ng-template #totalTemplate> Total : {{ total }} </ng-template>
