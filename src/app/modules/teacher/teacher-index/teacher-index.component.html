<div nz-row>
  <div nz-col nzSpan="24">
    <nz-card [nzBordered]="true" nzTitle="Teachers" [nzExtra]="extraTemplate">
      <app-owner-filter [value]="organisationId" (changed)="onOwnerFilter($event)"></app-owner-filter>
      <nz-table
        nzShowSizeChanger
        [nzData]="data"
        nzSize="small"
        [nzFrontPagination]="false"
        [nzTotal]="total"
        [nzPageSize]="pageSize"
        [nzPageIndex]="pageIndex"
        [nzLoading]="dataLoading"
        [nzHideOnSinglePage]="true"
        [nzBordered]="true"
        [nzHideOnSinglePage]="false"
        [nzPageSizeOptions]="[100, 200]"
        [nzScroll]="{ y: '640px' }"
        (nzQueryParams)="onQueryParamsChange($event)"
        [nzShowTotal]="totalTemplate"
      >
        <thead>
          <tr>
            <th nzColumnKey="schoolusername" nzCustomFilter>
              Teacher User Name
              <nz-filter-trigger
                [(nzVisible)]="searchData['schoolusername'].visible"
                [nzActive]="
                  (searchData['schoolusername']?.value?.length || 0) > 0
                "
                [nzDropdownMenu]="menu"
                (nzVisibleChange)="searchVisiblity($event, 'schoolusername')"
              >
                <i nz-icon nzType="search"></i>
              </nz-filter-trigger>
            </th>
            <th *ngIf="owner.active()" nzColumnKey="">Organisation</th>
            <th nzColumnKey="schoolname" nzCustomFilter>
              School
              <nz-filter-trigger
                [(nzVisible)]="searchData.schoolname.visible"
                [nzActive]="(searchData?.schoolname?.value?.length || 0) > 0"
                [nzDropdownMenu]="menu"
                (nzVisibleChange)="searchVisiblity($event, 'schoolname')"
              >
                <i nz-icon nzType="search"></i>
              </nz-filter-trigger>
            </th>

            <th *ngxPermissionsOnly="['update_teacher', 'zr5ER4QD', 'Mapyr2Pw', 'delete_teacher', 'superadmin']" nzColumnKey="">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of data">
            <td>
              {{ data["schoolusername"] }}
              <nz-tag *ngIf="data.isdisabled" nzColor="warning" data-testid="disabled-tag">Disabled</nz-tag>
            </td>
            <td *ngIf="owner.active()"><app-owner-name [id]="data.organisationid"></app-owner-name></td>
            <td>{{ data.schoolname }}</td>
            <td *ngxPermissionsOnly="['update_teacher', 'zr5ER4QD', 'Mapyr2Pw', 'delete_teacher', 'superadmin']">
              <button
                type="button"
                nz-button
                nzType="default"
                nzSize="small"
                nz-dropdown
                nzTrigger="click"
                (nzVisibleChange)="onMenuVisible($event, data)"
                aria-haspopup="menu"
                [attr.aria-expanded]="menuOpen === data.schooluserid"
                [attr.data-row-control]="data.schooluserid"
                nzPlacement="bottomRight"
                [nzDropdownMenu]="rowMenu"
                nz-popconfirm
                [nzPopconfirmTrigger]="null"
                [nzPopconfirmVisible]="confirming === data.schooluserid"
                (nzPopconfirmVisibleChange)="closeConfirm($event, data)"
                [nzPopconfirmTitle]="confirmTitle(data)"
                [nzOkText]="okText(data)"
                nzCancelText="Cancel"
                (nzOnConfirm)="onConfirm(data)"
                [attr.aria-label]="'Manage ' + data.schoolusername"
                data-testid="row-actions"
              >
                Manage
                <span nz-icon nzType="down" aria-hidden="true"></span>
              </button>
              <nz-dropdown-menu #rowMenu="nzDropdownMenu">
                <ul nz-menu role="menu">
                  <ng-container *ngxPermissionsOnly="['update_teacher', 'superadmin']">
                    <li
                      nz-menu-item
                      role="menuitem"
                      tabindex="0"
                      data-menu-action
                      data-testid="reset-password-item"
                      (click)="openReset(data)"
                      (keydown.enter)="$any($event.currentTarget).click()"
                      (keydown.space)="$event.preventDefault(); $any($event.currentTarget).click()"
                    >
                      Reset password
                    </li>
                    <li
                      nz-menu-item
                      role="menuitem"
                      data-menu-action
                      data-testid="toggle-disabled-item"
                      [attr.tabindex]="isChanging(data) ? -1 : 0"
                      [nzDisabled]="isChanging(data)"
                      [attr.aria-disabled]="isChanging(data)"
                      (click)="askToggle(data)"
                      (keydown.enter)="askToggle(data)"
                      (keydown.space)="$event.preventDefault(); askToggle(data)"
                    >
                      {{ data.isdisabled ? "Enable" : "Disable" }}
                    </li>
                  </ng-container>
                  <ng-container *ngxPermissionsOnly="['zr5ER4QD', 'Mapyr2Pw', 'delete_teacher', 'superadmin']">
                    <ng-container *ngxPermissionsOnly="['update_teacher', 'superadmin']">
                      <li nz-menu-divider></li>
                    </ng-container>
                    <li
                      nz-menu-item
                      nzDanger
                      role="menuitem"
                      data-menu-action
                      data-testid="delete-item"
                      [attr.tabindex]="isChanging(data) ? -1 : 0"
                      [nzDisabled]="isChanging(data)"
                      [attr.aria-disabled]="isChanging(data)"
                      (click)="askDelete(data)"
                      (keydown.enter)="askDelete(data)"
                      (keydown.space)="$event.preventDefault(); askDelete(data)"
                    >
                      Delete
                    </li>
                  </ng-container>
                </ul>
              </nz-dropdown-menu>
            </td>
          </tr>
        </tbody>
      </nz-table>
    </nz-card>
    <ng-template #extraTemplate>
      <ng-template [ngxPermissionsOnly]="['create_teacher']">
        <a
          target="_blank"
          style="margin-right: 32px"
          href="{{ sampleFile() }}"
          type="button"
          nzType="primary"
          nz-button
        >
          Sample File
          <i
            nz-icon
            nzType="question-circle"
            nzTheme="outline"
            nz-popover
            [nzPopoverContent]="contentTemplate"
            nzPopoverPlacement="left"
          ></i>
        </a>
  
        <span nz-tooltip [nzTooltipTitle]="owner.createBlocked() ? chooseOrganisationNotice : null" class="create-action-blocked" style="margin-right: 16px">
          <button
            (click)="showAddTeacher()"
            type="button"
            nzType="primary"
            nz-button
            [disabled]="owner.createBlocked()"
            data-testid="add-teacher"
          >
            + Add teacher
          </button>
        </span>

        <span nz-tooltip [nzTooltipTitle]="owner.createBlocked() ? chooseOrganisationNotice : null" class="create-action-blocked">
          <button
            (click)="showuploadTeachers()"
            type="button"
            nzType="primary"
            nz-button
            [disabled]="owner.createBlocked()"
          >
            Upload Teachers
          </button>
        </span>
      </ng-template>
    </ng-template>
    <nz-dropdown-menu #menu="nzDropdownMenu">
      <div class="ant-table-filter-dropdown">
        <div class="search-box">
          <input
            type="text"
            nz-input
            [(ngModel)]="searchData[currentSearch].value"
          />
          <button
            nz-button
            nzSize="small"
            nzType="primary"
            (click)="search()"
            class="search-button"
          >
            Search
          </button>
          <button nz-button nzSize="small" (click)="reset()">Reset</button>
        </div>
      </div>
    </nz-dropdown-menu>
  </div>
</div>
<ng-template #totalTemplate> Total : {{ total }} </ng-template>
<nz-modal
  [(nzVisible)]="showUpload"
  [nzClosable]="true"
  (nzOnCancel)="closeUpload()"
  nzTitle="Upload Teachers"
  [nzFooter]="uploadFooter"
>
  <ng-container *nzModalContent>
    <form [formGroup]="uploadForm" nz-form nzLayout="vertical">
      <nz-form-item>
        <nz-form-label>School</nz-form-label>
        <nz-form-control nzErrorTip="Please select school">
          <nz-select formControlName="schoolname" nzPlaceHolder="Select school">
            <nz-option
              *ngFor="let option of school$ | async"
              [nzLabel]="option.schoolname"
              [nzValue]="option.schoolname"
            ></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>

<ng-template [nzModalFooter] #uploadFooter>
  <nz-upload
    [nzMultiple]="false"
    [nzShowUploadList]="false"
    [(nzFileList)]="fileList"
    (nzChange)="handleChange($event)"
  >
    <button type="button" nzType="primary" nz-button>Upload</button>
  </nz-upload>
</ng-template>
<ng-template #titleTemplate>
  <i nz-icon nzType="close"></i>
  Title
</ng-template>
<ng-template #contentTemplate>
  <table>
    <tr>
      <td><b>Mandatoy Fields</b></td>
      <td>:</td>
      <td>schoolusername, schooluserpasswordhash</td>
    </tr>
  </table>
</ng-template>
<app-add-teacher-drawer
  [open]="showAddTeacherDrawer"
  (added)="onTeacherAdded()"
  (closed)="closeAddTeacher()"
></app-add-teacher-drawer>
<app-reset-password-drawer
  [open]="resetFor !== null"
  kind="teacher"
  [schooluserid]="resetRow?.schooluserid ?? ''"
  [username]="resetRow?.schoolusername ?? ''"
  [accountDisabled]="!!resetRow?.isdisabled"
  (closed)="closeReset()"
></app-reset-password-drawer>
